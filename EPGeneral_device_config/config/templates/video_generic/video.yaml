schema_version: 2
enabled: true
input_mode: ros_image
image_topic: /devices/{device_id}/camera/image_raw
image_message_type: sensor_msgs/Image
output_width: 640
output_height: 480
framerate: 30
srt_bind_address: 0.0.0.0
srt_port: 9000
srt_latency_ms: 120
bitrate_kbps: 2000
rotation_degrees: 0
frame_timeout_seconds: 5.0
runtime:
  status_topic: ~status
  reconnect_interval_seconds: 3.0
  decoder_preload: []
capture:
  enabled: false
