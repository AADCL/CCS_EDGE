deployment:
  state: active
  enabled: true
schema_version: 6
protocol_id: ccs-map-stream-v2
network:
  bind_host: 0.0.0.0
  control_port: 14561
  ground_station_ip: 192.168.50.101
  data_port: 14562
  max_datagram_bytes: 1400
http:
  bind_host: 0.0.0.0
  port: 14600
  token_ttl_seconds: 900.0
ros:
  inputs:
    lidar:
      topic: /livox/lidar
      message_type: livox_ros_driver2/CustomMsg
      frame: livox_frame
    imu:
      topic: /livox/imu
      message_type: sensor_msgs/Imu
      frame: livox_frame
  stream:
    cloud:
      topic: /ducted/mapping/cloud_registered
      message_type: sensor_msgs/PointCloud2
      frame: camera_init
      coordinates: map
    pose:
      topic: /ducted/localization/odom
      message_type: nav_msgs/Odometry
      position_path: pose.pose.position
      orientation_path: pose.pose.orientation
  frames:
    map: camera_init
    preview: odom
    body: body
    sensor: body
  body_from_sensor:
    x: 0.0
    y: 0.0
    z: 0.0
    qx: 0.0
    qy: 0.0
    qz: 0.0
    qw: 1.0
integrations:
  backend: ducted_uav
  mapping_prerequisites:
    setup_file: /home/nrc/catkin_ws/devel/setup.bash
    launch_file: mapping.launch
    extrinsics_file: /home/nrc/catkin_ws/src/ducted_bringup/config/external_odometry.yaml
    startup_timeout_seconds: 45.0
  fast_lio:
    setup_file: /home/nrc/catkin_ws/devel/setup.bash
    package: ducted_bringup
    launch_file: mapping.launch
    launch_args: []
    startup_timeout_seconds: 60.0
    stop_timeout_seconds: 30.0
    pid_path: '{session_dir}/mapping.pid'
    log_path: '{session_dir}/mapping.log'
  map_accumulator:
    setup_file: /home/nrc/catkin_ws/devel/setup.bash
    service: /ducted/mapping/save_map
    save_timeout_seconds: 300.0
  pgm:
    setup_file: /home/nrc/catkin_ws/devel/setup.bash
    package: epgeneral_uav_integration
    launch_file: relocalization_session.launch
    launch_args: []
    generation_timeout_seconds: 300.0
    log_path: '{session_dir}/save_mapping.log'
sync:
  tolerance_seconds: 0.05
  pose_buffer_size: 100
  preview_transform_timeout_seconds: 0.2
preprocess:
  sample_window_seconds: 1.0
  preview_transport: pcd_fragment_http
  min_range_m: 0.3
  max_range_m: 100.0
  voxel_size_m: 0.10
timeouts:
  prepare_probe_timeout_seconds: 1.5
  integration_check_timeout_seconds: 8.0
  ready_timeout_seconds: 60.0
  input_timeout_seconds: 3.0
  command_cache_seconds: 60.0
  artifact_poll_seconds: 0.5
  artifact_stable_polls: 2
limits:
  max_preview_bytes_per_second: 500000
  max_frame_points: 200000
  max_window_points: 1000000
  max_decompressed_bytes: 2400000
  max_artifact_bytes: 4294967296
  min_free_bytes: 1073741824
  command_output_bytes: 16384
  max_preview_fragment_bytes: 500000
  max_pending_preview_fragments: 1
  max_unacked_preview_fragments: 4
artifacts:
  frame: odom
  workspace_root: /home/nrc/ccs_edge_ws/run/map_stream
  accumulator_pcd_path: /home/nrc/ccs_edge_ws/run/map_stream/current/map.pcd
  source_pcd_path: /home/nrc/ccs_edge_ws/run/map_stream/current/map.pcd
  source_pgm_path: /home/nrc/ccs_edge_ws/run/map_stream/current/map.pgm
  source_yaml_path: /home/nrc/ccs_edge_ws/run/map_stream/current/map.yaml
  archive_root: /home/nrc/ccs_edge_ws/maps/archive
  pcd_path: '{session_dir}/map.pcd'
  # Optional occupancy output; keep beside the original PCD. Native exporter paths are configured separately.
  ot_path: "{session_dir}/map.ot"
  pgm_path: '{session_dir}/map.pgm'
  yaml_path: '{session_dir}/map.yaml'
