schema_version: 2
protocol_id: ccs-task-control-v2
network:
  bind_host: 0.0.0.0
  control_port: 14563
  ground_station_ip: 192.168.50.101
  status_port: 14564
  max_datagram_bytes: 1400
storage:
  directory: /home/nrc/ccs_edge_ws/mission
ros:
  command_topic: /uav/UAV_001/execution_command
  feedback_topic: /uav/UAV_001/execution_feedback
  status_topic: /uav/UAV_001/task_status
  map_frame: map
timeouts:
  ack_cache_seconds: 60.0
  transfer_seconds: 10.0
  adapter_feedback_seconds: 2.0
  execution_feedback_seconds: 5.0
  preparation_retry_seconds: 5.0
  utc_tolerance_seconds: 2.0
limits:
  max_waypoints: 500
  max_compressed_bytes: 1048576
  max_raw_bytes: 8388608
  max_chunks: 2048
adapter:
  type: ducted_uav
  workspace: /home/nrc/ccs_edge_ws
  active_map_state_file: /home/nrc/ccs_edge_ws/run/state/relocalization.json
  emergency_stop_state_file: /home/nrc/ccs_edge_ws/run/state/emergency_stop.json
