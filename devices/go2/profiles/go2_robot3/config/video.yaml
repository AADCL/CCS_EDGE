schema_version: 2
enabled: true
input_mode: ros_image
camera_model: Intel RealSense D435i
image_topic: /camera/color/image_raw
image_message_type: sensor_msgs/Image
output_width: 640
output_height: 480
framerate: 15
srt_bind_address: 0.0.0.0
srt_port: 9000
srt_latency_ms: 120
bitrate_kbps: 2500
frame_timeout_seconds: 5.0
rotation_degrees: 0
runtime:
  status_topic: ~status
  reconnect_interval_seconds: 3.0
  decoder_preload: []
capture:
  enabled: true
  package: realsense2_camera
  launch: rs_camera.launch
  args:
    enable_color: true
    color_width: 640
    color_height: 480
    color_fps: 15
    enable_depth: false
    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    publish_tf: false
  arg_env:
    serial_no: CCS_D435_SERIAL
