schema_version: 2
protocol_id: ccs-udp-telemetry-v1
network:
  destination_host: 192.168.50.101
  destination_port: 14560
  max_datagram_bytes: 16384
descriptors:
- name: vision_pose
  display_name: 本地位姿
  type: pose
  level: 1
  source:
    topic: /fastlio_odom
    message_type: nav_msgs/Odometry
    mapping:
      position: pose.pose.position
      orientation: pose.pose.orientation
    mode: ros_fields
    stale_policy: hold
    max_age_seconds: 3.0
    aggregation: mean
    max_samples: 1000
    units:
      position: m
- name: imu
  display_name: IMU
  type: imu
  level: 1
  source:
    topic: /livox/imu
    message_type: sensor_msgs/Imu
    mapping:
      orientation: orientation
      angular_velocity: angular_velocity
      linear_acceleration: linear_acceleration
    mode: ros_fields
    stale_policy: hold
    max_age_seconds: 3.0
    aggregation: mean
    max_samples: 1000
    units:
      angular_velocity: rad/s
      linear_acceleration: m/s2
- name: livox_pointcloud
  display_name: 雷达点云
  type: pointcloud_status
  level: 2
  source:
    topic: /livox/lidar
    timeout_seconds: 1.0
    mode: topic_freshness
- name: livox_driver
  display_name: Livox 驱动
  type: availability
  level: 3
  source:
    topic: /livox/lidar
    timeout_seconds: 3.0
    mode: topic_freshness
- name: fastlio2
  display_name: FAST-LIO2 定位状态
  type: availability
  level: 3
  source:
    topic: /Odometry
    timeout_seconds: 3.0
    mode: topic_freshness
- name: pgm_mapping
  display_name: PGM 地图状态
  type: availability
  level: 3
  source:
    kind: pgm_file
    topic: /ccs/relocalization/pgm_file
    state_file: /home/nrc19/.ros/ccs_edge_dev_wheeltec_r550p/state/relocalization.json
    map_root: /home/nrc19/livox_fastlio/maps/ccs_download
    mode: file_status
    state_field: map_id
    path_template: '{map_id}/map.pgm'
runtime:
  link_status_topic: /ugv/{device_id}/link/udp_tx
  diagnostics_topic: /ugv/{device_id}/diagnostics
