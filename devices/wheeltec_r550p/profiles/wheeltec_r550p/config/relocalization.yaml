schema_version: 1
protocol_id: ccs-relocalization-v1
enabled: true
backend: wheeltec_r550p
network:
  bind_host: 0.0.0.0
  control_port: 14565
  ground_station_ip: 192.168.50.101
  status_port: 14566
  max_datagram_bytes: 1400
storage:
  map_root: /home/nrc19/ccs_edge_ws/maps/download
  active_map_state_file: /home/nrc19/ccs_edge_ws/run/state/relocalization.json
  max_artifact_bytes: 4294967296
  download_timeout_seconds: 300.0
ros:
  map_frame: map
  odom_frame: odom
  initial_pose_topic: /initialpose
  map_topic: /map_2d
  startup_timeout_seconds: 60.0
  stages:
  - name: localization
    package: epgeneral_wheeltec_integration
    launch: localization.launch
    args:
    - map_dir:={map_dir}
    - map_pcd:={map_pcd}
    - map_yaml:={map_yaml}
  algorithm_lock_file: /home/nrc19/ccs_edge_ws/run/algorithm.lock
  navigation_guard_file: /home/nrc19/ccs_edge_ws/run/navigation.lock
tf_stability:
  timeout_seconds: 30.0
  sample_hz: 10.0
  sample_count: 10
  translation_tolerance_m: 0.1
  yaw_tolerance_deg: 2.0
trusted_regions:
  enabled: true
  root: /home/nrc19/ccs_edge_ws/run/trusted_regions
