# Gemini 336L mount is inverted; rotation applies only to encoded video.
enabled: true
camera_model: "Orbbec Gemini 336L"
image_topic: "/camera/color/image_raw"
image_message_type: "sensor_msgs/Image"
output_width: 640
output_height: 480
framerate: 30
rotation_degrees: 180
srt_bind_address: "0.0.0.0"
srt_port: 9000
srt_latency_ms: 120
bitrate_kbps: 2500
frame_timeout_seconds: 5.0
rotation_degrees: 0
runtime:
  status_topic: ~status
  reconnect_interval_seconds: 3.0
  decoder_preload: []
capture:
  enabled: false
