schema_version: 2
protocol_id: ccs-udp-telemetry-v1
network:
  destination_host: 192.168.50.101
  destination_port: 14560
  max_datagram_bytes: 16384
descriptors:
- name: global_pose
  display_name: 全局位姿
  type: pose
  level: 1
  source:
    topic: /mavros/local_position/pose
    message_type: geometry_msgs/PoseStamped
    mapping:
      position: pose.position
      orientation: pose.orientation
    mode: ros_fields
    stale_policy: hold
    max_age_seconds: 3.0
    aggregation: mean
    max_samples: 1000
    units:
      position: m
- name: vision_pose
  display_name: 视觉传感器位姿
  type: pose
  level: 1
  source:
    topic: /Odometry
    message_type: nav_msgs/Odometry
    mapping:
      position: pose.pose.position
      orientation: pose.pose.orientation
    mode: ros_fields
    stale_policy: hold
    max_age_seconds: 3.0
    aggregation: mean
    max_samples: 1000
    units:
      position: m
- name: imu
  display_name: IMU
  type: imu
  level: 1
  source:
    topic: /mavros/imu/data
    message_type: sensor_msgs/Imu
    mapping:
      orientation: orientation
      angular_velocity: angular_velocity
      linear_acceleration: linear_acceleration
    mode: ros_fields
    stale_policy: hold
    max_age_seconds: 3.0
    aggregation: mean
    max_samples: 1000
    units:
      angular_velocity: rad/s
      linear_acceleration: m/s2
- name: livox_pointcloud
  display_name: 雷达点云
  type: pointcloud_status
  level: 2
  source:
    topic: /livox/lidar
    timeout_seconds: 1.0
    mode: topic_freshness
- name: livox_driver
  display_name: Livox 驱动
  type: availability
  level: 3
  source:
    topic: /livox/lidar
    timeout_seconds: 3.0
    mode: topic_freshness
- name: fastlio2
  display_name: FAST-LIO2 定位状态
  type: availability
  level: 3
  source:
    topic: /Odometry
    timeout_seconds: 3.0
    mode: topic_freshness
- name: pgm_mapping
  display_name: PGM 地图生成状态
  type: availability
  level: 3
  source:
    topic: /ground_air/mapping/status
    timeout_seconds: 3.0
    mode: topic_freshness
- name: octomap_mapping
  display_name: 八叉树地图生成状态
  type: availability
  level: 3
  source:
    topic: /octomap_binary
    timeout_seconds: 3.0
    mode: topic_freshness
- name: occupancy_grid_mapping
  display_name: 占据栅格图生成状态
  type: availability
  level: 3
  source:
    topic: /map
    timeout_seconds: 3.0
    mode: topic_freshness
- name: mapping_mode
  display_name: 当前建图模式
  type: text_status
  level: 3
  source:
    topic: /mapping_mode
    message_type: std_msgs/String
    timeout_seconds: 3.0
    mapping:
      value: data
    mode: ros_fields
    stale_policy: hold
    max_age_seconds: 3.0
    aggregation: latest
    max_samples: 1000
runtime:
  link_status_topic: /agv/{device_id}/link/udp_tx
  diagnostics_topic: /agv/{device_id}/diagnostics
