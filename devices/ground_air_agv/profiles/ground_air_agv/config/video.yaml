schema_version: 2
enabled: true
input_mode: ros_image
camera_model: SIYI A8 Mini
image_topic: /a8_cam/image_raw
image_message_type: sensor_msgs/Image
output_width: 1280
output_height: 720
framerate: 30
srt_bind_address: 0.0.0.0
srt_port: 9000
srt_latency_ms: 120
bitrate_kbps: 3000
frame_timeout_seconds: 5.0
rotation_degrees: 0
runtime:
  status_topic: ~status
  reconnect_interval_seconds: 3.0
  decoder_preload: []
capture:
  enabled: true
  package: a8_mini_camera
  launch: a8_mini_camera.launch
  args:
    camera_ip: 192.168.144.25
    image_topic: /a8_cam/image_raw
